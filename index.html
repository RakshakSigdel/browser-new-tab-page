<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New tab</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><script defer src="vendor/nepali-date-converter.js"></script><script defer src="app.js"></script></head>
<body><main class="workspace">
<header><h1>Rakshak&#8217;s space<span id="today"></span></h1><div><button id="appearance" aria-label="Change background" title="Change background">◐</button><button id="manage">Edit shortcuts</button></div></header>
<div class="board">
<div class="left-column"><section class="widget todo"><div class="heading"><h2>To do</h2><span id="task-count"></span></div><form id="task-form"><input id="task-input" aria-label="New task" placeholder="Add a task…" maxlength="160" required><button aria-label="Add task">+</button></form><div id="tasks" class="scroll-area"></div></section><section class="widget calendar"><div class="heading"><button id="month-prev" aria-label="Previous month">‹</button><h2 id="month"></h2><button id="month-next" aria-label="Next month">›</button></div><div class="calendar-controls"><select id="calendar-mode" aria-label="Calendar type"><option value="bs">नेपाली · BS</option><option value="ad">English · AD</option></select><span id="calendar-subtitle"></span></div><div class="weekdays" id="weekdays"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div id="calendar-grid"></div><button id="calendar-today">Today</button></section></div>
<div class="center-column"><section class="widget search-widget"><form id="search-form"><select id="engine" aria-label="Search engine"><option value="brave">Brave</option><option value="google">Google</option><option value="youtube">YouTube</option><option value="duckduckgo">DuckDuckGo</option></select><input id="query" aria-label="Search" placeholder="Search anything…" required autocomplete="off"><button aria-label="Search">⌕</button></form></section>
<section class="links-widget"><div class="heading"><h2>Shortcuts</h2><div><button id="previous" aria-label="Previous shortcuts">‹</button><span id="page-label"></span><button id="next" aria-label="Next shortcuts">›</button><button id="add" aria-label="Add shortcut">+</button></div></div><div id="shortcuts"></div></section>
<section class="clocks"><article class="widget clock-card"><div class="city"><span>Kathmandu</span><span id="ktm-zone"></span></div><div class="time-row"><time id="ktm-time"></time><span id="ktm-period"></span></div><div class="clock-date" id="ktm-date"></div></article><article class="widget clock-card"><div class="city"><span>Chicago</span><span id="chi-zone"></span></div><div class="time-row"><time id="chi-time"></time><span id="chi-period"></span></div><div class="clock-date" id="chi-date"></div></article></section>
<section class="widget notes"><div class="heading"><h2>Notes</h2><span id="notes-status">Saved on this device</span></div><textarea id="notes" aria-label="Notes" placeholder="A thought, a lyric, something to remember…" maxlength="20000"></textarea></section>
</div>
<section class="widget weather"><div class="heading"><h2>Weather</h2><button id="weather-refresh" aria-label="Refresh weather">↻</button></div><select id="weather-city" aria-label="Weather location"><option value="itahari">Itahari</option><option value="ktm">Kathmandu</option><option value="chi">Chicago</option></select><div class="current-weather"><span id="weather-icon" aria-hidden="true">☁</span><strong id="temperature">—</strong><span id="condition">Loading weather…</span><span id="weather-detail"></span></div><div id="forecast"></div><div class="weather-footer"><span id="weather-status" role="status"></span><a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo ↗</a></div></section>
<section class="widget dock"><div class="dock-label">Quick links</div><div id="quick-links"></div><button id="add-quick" aria-label="Add quick link">+</button></section>
</div></main>
<dialog id="editor"><form id="edit-form"><div class="heading"><h2 id="title">Add shortcut</h2><button type="button" id="close" aria-label="Close">×</button></div><label>Name<input id="name" required maxlength="30" placeholder="YouTube"></label><label>Website<input id="url" required placeholder="youtube.com"></label><label>Position <input id="position" type="number" min="1" step="1" required></label><p class="hint">1 is first. You can also drag shortcuts to rearrange them.</p><p id="error" role="alert"></p><div class="actions"><button type="button" id="remove">Remove</button><button class="primary">Save</button></div></form></dialog><div id="notice" role="status"></div></body></html>
